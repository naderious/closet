name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build for iOS devices
        run: |
          set -o pipefail
          xcodebuild \
            -project Closet.xcodeproj \
            -scheme Closet \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || status=$?
          grep -E "(error|warning): " build.log | sort -u | head -200 || true
          tail -n 25 build.log
          exit ${status:-0}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
